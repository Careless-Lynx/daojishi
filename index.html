<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2027春节倒计时</title>
	<link rel="stylesheet" href="./css/daojishi.css">
</head>

<body onload="systemTime()">

	<!-- 背景 -->
	<div class="swiper-container banner">
		<div class="swiper-wrapper">
			<div class="swiper-slide" style="background-image: url(./image/hcny.jpg);"></div>
		</div>
	</div>

	<!-- 主体 -->
	<div class="section bg3">
		<div class="container">

			<div class="section-title">
				<small>当前时间：<span id="time1"></span></small><br>
				除夕时间：2027-02-06 00:00:00
			</div>

			<dl class="in-about clearfix">
				<dd>
					<h4>
						距离2027春节还有
						<div id="time" class="time" align="center"></div>
					</h4>
				</dd>
			</dl>

		</div>
	</div>

	<script>
		function show_date_time() {
			setTimeout(show_date_time, 1000);

			// ✅ 正确写法（月份从0开始，1=2月）
			const target = new Date(2027, 1, 6, 0, 0, 0);

			const now = new Date();
			const diff = target - now;

			if (diff <= 0) {
				document.getElementById("time").innerHTML = "已到春节！";
				return;
			}

			let seconds = Math.floor(diff / 1000);
			let days = Math.floor(seconds / (24 * 60 * 60));
			seconds %= (24 * 60 * 60);

			let hours = Math.floor(seconds / 3600);
			seconds %= 3600;

			let minutes = Math.floor(seconds / 60);
			seconds %= 60;

			// 补零
			days = days.toString().padStart(2, "0");
			hours = hours.toString().padStart(2, "0");
			minutes = minutes.toString().padStart(2, "0");
			seconds = seconds.toString().padStart(2, "0");

			document.getElementById("time").innerHTML =
				"<span style='font-size:30px'>" +
				days + "天" +
				hours + "小时" +
				minutes + "分" +
				"<span style='color:#ff6633;'>" + seconds + "</span>秒</span>";
		}

		function systemTime() {
			const now = new Date();

			const format = n => n.toString().padStart(2, "0");

			const str =
				now.getFullYear() + "-" +
				format(now.getMonth() + 1) + "-" +
				format(now.getDate()) + " " +
				format(now.getHours()) + ":" +
				format(now.getMinutes()) + ":" +
				format(now.getSeconds());

			document.getElementById("time1").innerHTML = str;

			setTimeout(systemTime, 1000);
		}

		show_date_time();
	</script>

</body>
</html>
